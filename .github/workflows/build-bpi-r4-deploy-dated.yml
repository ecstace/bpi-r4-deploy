name: Build BPI-R4 Deploy

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant'
        required: true
        default: 'standard'
        type: choice
        options:
          - standard
          - wired
      repo_commit:
        description: 'Commit hash of this repository (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPENWRT_COMMIT: "949487e0900b92a87b5f5bc5db9861ce3480db6a"
  MTK_COMMIT: "0865c34936480df69ab766c52493ecdd0418fe3d"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.repo_commit || github.sha }}

      - name: Set build variables
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          BUILD_DATE="$(date +%Y%m%d)-${{ github.run_number }}"

          if [ "$VARIANT" = "wired" ]; then
            echo "BUILDER=./builder-wired-universal.sh" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-4gb-wired-${BUILD_DATE} release-4gb-poe-wired-${BUILD_DATE} release-8gb-wired-${BUILD_DATE} release-8gb-poe-wired-${BUILD_DATE} release-8gb-wired-unifi-${BUILD_DATE} release-8gb-poe-wired-unifi-${BUILD_DATE}" >> $GITHUB_ENV
          else
            echo "BUILDER=./builder-wifimgr-universal.sh" >> $GITHUB_ENV
            echo "RELEASE_TAGS=release-4gb-standard-${BUILD_DATE} release-4gb-poe-${BUILD_DATE} release-8gb-standard-${BUILD_DATE} release-8gb-poe-${BUILD_DATE}" >> $GITHUB_ENV
          fi
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

      - name: Free disk space on runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-distutils python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Restore repository cache
        id: cache-repos
        uses: actions/cache@v4
        with:
          path: |
            repo-cache/openwrt.tar.gz
            repo-cache/mtk-openwrt-feeds.tar.gz
          key: repos-${{ env.OPENWRT_COMMIT }}-${{ env.MTK_COMMIT }}

      - name: Clone and cache repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: |
          mkdir -p repo-cache

          git clone --branch openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt-clone
          cd openwrt-clone && git checkout ${{ env.OPENWRT_COMMIT }} && cd ..
          tar -czf repo-cache/openwrt.tar.gz openwrt-clone
          rm -rf openwrt-clone

          git clone --branch master https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds mtk-clone
          cd mtk-clone && git checkout ${{ env.MTK_COMMIT }} && cd ..
          tar -czf repo-cache/mtk-openwrt-feeds.tar.gz mtk-clone
          rm -rf mtk-clone

      - name: Run builder script
        run: |
          chmod +x ${{ env.BUILDER }}
          ${{ env.BUILDER }}
        env:
          OPENWRT_COMMIT: ${{ env.OPENWRT_COMMIT }}
          MTK_COMMIT: ${{ env.MTK_COMMIT }}

      - name: Prepare release artifacts
        run: |
          VARIANT="${{ github.event.inputs.variant }}"
          FILOGIC="openwrt/bin/targets/mediatek/filogic"

          # Prepare artifact directory for one release tag
          # Args: dir, itb_src, itb_dst, nvme, sdcard, emmc, snand
          make_release_dir() {
            local DIR="$1"
            local ITB_SRC="$2"
            local ITB_DST="$3"
            local NVME="$4"
            local SDCARD="$5"
            local EMMC="$6"
            local SNAND="$7"

            mkdir -p "$DIR"
            cp "${FILOGIC}/${ITB_SRC}"   "${DIR}/${ITB_DST}"
            cp "${FILOGIC}/${NVME}"      "${DIR}/${NVME}"
            cp "${FILOGIC}/${SDCARD}"    "${DIR}/${SDCARD}"
            cp "${FILOGIC}/${EMMC}"      "${DIR}/${EMMC}"
            cp "${FILOGIC}/${SNAND}"     "${DIR}/${SNAND}"
            cp "${FILOGIC}/config.buildinfo" "${DIR}/"
            cd "$DIR"
            sha256sum "${ITB_DST}" "${NVME}" "${SDCARD}" "${EMMC}" "${SNAND}" > sha256sums
            cd ..
          }

          # 4GB non-poe
          make_release_dir rel-4gb \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-squashfs-sysupgrade.itb" \
            "bpi-r4.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-snand-img.bin"

          # 4GB PoE
          make_release_dir rel-4gb-poe \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-squashfs-sysupgrade.itb" \
            "bpi-r4-poe.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-snand-img.bin"

          # 8GB non-poe
          make_release_dir rel-8gb \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-squashfs-sysupgrade.itb" \
            "bpi-r4.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-8gb-snand-img.bin"

          # 8GB PoE
          make_release_dir rel-8gb-poe \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-squashfs-sysupgrade.itb" \
            "bpi-r4-poe.itb" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-nvme-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-sdcard.img.gz" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-emmc-img.bin" \
            "openwrt-mediatek-filogic-bananapi_bpi-r4-poe-8gb-snand-img.bin"

          # SD rescue image into all release dirs
          for DIR in rel-4gb rel-4gb-poe rel-8gb rel-8gb-poe; do
            cp rescue/bpi-r4-rescue-sdcard.img.gz "$DIR/"
          done

          # UniFi variants = same firmware as 8gb wired + UniFi scripts
          if [ "$VARIANT" = "wired" ]; then
            cp -r rel-4gb     rel-4gb-wired
            cp -r rel-4gb-poe rel-4gb-poe-wired
            cp -r rel-8gb     rel-8gb-wired
            cp -r rel-8gb-poe rel-8gb-poe-wired

            cp -r rel-8gb     rel-8gb-unifi
            cp -r rel-8gb-poe rel-8gb-poe-unifi

            for DIR in rel-8gb-unifi rel-8gb-poe-unifi; do
              cp unifi/unifi-setup.sh             "$DIR/"
              cp unifi/rc.local                   "$DIR/"
              cp unifi/rc-network.sh              "$DIR/"
              cp unifi/unifi-network-setup-8gb.sh "$DIR/unifi-network-setup.sh"
            done
          fi

      - name: Publish luci-app-wifimgr APK
        if: github.event.inputs.variant == 'standard'
        run: |
          APK=$(ls openwrt/bin/packages/aarch64_cortex-a53/luci/luci-app-wifimgr-*.apk 2>/dev/null | head -1)
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK_NAME=$(basename $APK)" >> $GITHUB_ENV

      - name: Publish wifimgr-latest release
        if: github.event.inputs.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wifimgr-build-${{ env.BUILD_DATE }}
          name: "luci-app-wifimgr (build ${{ env.BUILD_DATE }})"
          body: |
            Standalone APK for luci-app-wifimgr — install on any BPI-R4 running this firmware.

            ```
            apk add --allow-untrusted --no-network /tmp/${{ env.APK_NAME }}
            ```

            Built from commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-standard
        if: github.event.inputs.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-standard-${{ env.BUILD_DATE }}
          name: "BPI-R4 4GB standard WiFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: standard (WiFi) | RAM: 4GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-poe
        if: github.event.inputs.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-poe-${{ env.BUILD_DATE }}
          name: "BPI-R4 4GB PoE WiFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: standard (WiFi) | RAM: 4GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-poe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-standard
        if: github.event.inputs.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-standard-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB standard WiFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: standard (WiFi) | RAM: 8GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe
        if: github.event.inputs.variant == 'standard'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB PoE WiFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: standard (WiFi) | RAM: 8GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-wired
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-wired-${{ env.BUILD_DATE }}
          name: "BPI-R4 4GB wired (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 4GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-4gb-poe-wired
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-4gb-poe-wired-${{ env.BUILD_DATE }}
          name: "BPI-R4 4GB PoE wired (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 4GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-4gb-poe-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-wired
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-wired-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB wired (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe-wired
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe-wired-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB PoE wired (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | PoE
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe-wired/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-wired-unifi
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-wired-unifi-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB wired UniFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | UniFi stack
            Includes: unifi-setup.sh, unifi-network-setup.sh, rc.local, rc-network.sh
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-unifi/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release-8gb-poe-wired-unifi
        if: github.event.inputs.variant == 'wired'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-8gb-poe-wired-unifi-${{ env.BUILD_DATE }}
          name: "BPI-R4 8GB PoE wired UniFi (build ${{ env.BUILD_DATE }})"
          body: |
            Variant: wired (no WiFi) | RAM: 8GB | PoE | UniFi stack
            Includes: unifi-setup.sh, unifi-network-setup.sh, rc.local, rc-network.sh
            Commit: ${{ github.event.inputs.repo_commit || github.sha }}
          files: rel-8gb-poe-unifi/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
